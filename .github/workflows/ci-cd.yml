name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (install, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install NPM packages
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build (TypeScript -> JavaScript)
        run: npm run build

  client:
    name: Client (install, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install NPM packages
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build (TypeScript -> JavaScript, Vite bundle)
        run: npm run build

  deploy:
    name: Deploy (migrations + Render)
    # CD тільки після успішного CI і тільки для push в основну гілку (не для PR)
    needs: [backend, client]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install and build backend (for migrations)
        working-directory: Backend
        run: |
          npm ci
          npm run build

      - name: Run DB migrations on cloud database
        working-directory: Backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migration:run:prod

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
